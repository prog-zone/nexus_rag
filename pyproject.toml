[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus_rag"
version = "0.1.0"
description = "Backend API for AI-assisted legal document analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pwdlib[argon2]",
    "pyjwt",
    "greenlet",
    "fastapi-mail",
    "slowapi",
    "structlog",
    "gunicorn",
    "qdrant-client",
    "langchain",
    "langchain-openai",
    "unstructured-client",
    "redis",
    "taskiq",
    "taskiq-redis",
    "taskiq-fastapi",
    "fastembed",
    "aioboto3",
    "voyageai",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ragas>=0.4.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "ragas: marks tests as RAGAS evaluation tests (slow, requires OpenAI API)",
]
